# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

# format = '''($git_branch$git_commit$git_state$git_status
# )$hostname$sudo${custom.path}($directory)$shell$character'''

format = """
$username\
$hostname\
$shell\
${custom.path}\
$git_branch\
$character\
"""

palette = 'cyberdream'

[palettes.nightowl]
palette0 = "#011627"
palette1 = "#EF5350"
palette2 = "#22da6e"
palette3 = "#addb67"
palette4 = "#82aaff"
palette5 = "#c792ea"
palette6 = "#21c7a8"
palette7 = "#ffffff"
palette8 = "#575656"
palette9 = "#ef5350"
palette10 = "#22da6e"
palette11 = "#ffeb95"
palette12 = "#82aaff"
palette13 = "#c792ea"
palette14 = "#7fdbca"
palette15 = "#ffffff"

[palettes.cyberdream]
palette0 = "#16181a"
palette1 = "#ff6e5e"
palette2 = "#5eff6c"
palette3 = "#f1ff5e"
palette4 = "#5ea1ff"
palette5 = "#bd5eff"
palette6 = "#5ef1ff"
palette7 = "#ffffff"
palette8 = "#3c4048"
palette9 = "#ff6e5e"
palette10 = "#5eff6c"
palette11 = "#f1ff5e"
palette12 = "#5ea1ff"
palette13 = "#bd5eff"
palette14 = "#5ef1ff"
palette15 = "#ffffff"
darkgreen = "#12A585"

[username]
show_always = true
format = '[$user](bold palette10)'

[hostname]
ssh_only = false
ssh_symbol = '@'
format = '[$ssh_symbol$hostname]($style)'
trim_at = '.'
style = 'bold palette3'

[shell]
format = '[/$indicator](palette12)'
disabled = false

[git_branch]
format = '[\(*\)](palette13)'

[custom.path]
when = true
command = "~/pcwd.sh"
shell = "dash"
format = '[\[$output\]](palette14)'

[character]
success_symbol = '[>](darkgreen)'
error_symbol = '[X>](palette9)'

[time]
disabled = false
time_format = "%D %r"
format = '[$time](palette4)[>](palette2)'

